<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="c1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#181836" />
    </linearGradient>

    <!-- Outer Rim -->
    <linearGradient id="c1-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Screen Canvas Gradient -->
    <linearGradient id="c1-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#151d38" />
    </linearGradient>

    <!-- Projector / Stage Ambient Beam -->
    <linearGradient id="c1-beam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- M Symbol Glow -->
    <linearGradient id="c1-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="c1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#c1-bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#c1-rim)" stroke-width="2.5" opacity="0.35" />

  <!-- Projection Light Beam radiating up to screen -->
  <polygon points="200,410 312,410 448,100 64,100" fill="url(#c1-beam)" />

  <!-- Studio Display Stand (Pedestal / Easel) -->
  <path d="M 232 344 L 214 412 H 298 L 280 344 Z" fill="#131b2e" stroke="#1e293b" stroke-width="2" />
  <rect x="176" y="410" width="160" height="14" rx="7" fill="#0f172a" stroke="url(#c1-rim)" stroke-width="1.8" />
  <rect x="236" y="415" width="40" height="4" rx="2" fill="#38bdf8" />

  <!-- 16:9 Presentation Display Screen -->
  <rect x="52" y="96" width="408" height="252" rx="24" fill="url(#c1-screen)" stroke="url(#c1-rim)" stroke-width="3.5" />

  <!-- Screen Top Bar with Presentation Status -->
  <line x1="52" y1="142" x2="460" y2="142" stroke="#1e293b" stroke-width="2" />
  
  <!-- Presentation Play Mode Badge -->
  <rect x="76" y="112" width="76" height="20" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
  <polygon points="88,118 96,122 88,126" fill="#38bdf8" />
  <text x="120" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8">SLIDES</text>

  <!-- Slide Aspect Indicator -->
  <rect x="388" y="112" width="48" height="20" rx="10" fill="#1e293b" />
  <text x="412" y="125" font-family="monospace" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">16 : 9</text>

  <!-- ================= SLIDE CONTENT ================= -->
  <!-- Left: Bold Markdown M Glyph -->
  <g transform="translate(96, 172)">
    <path d="M 0 132 V 14 L 46 80 L 92 14 V 132" 
          fill="none" stroke="url(#c1-m)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Center: Dynamic Transition Arrow (Code -> Slide) -->
  <g transform="translate(222, 222)">
    <path d="M 0 16 H 32" stroke="#818cf8" stroke-width="7" stroke-linecap="round" />
    <path d="M 22 4 L 34 16 L 22 28" fill="none" stroke="#818cf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right: Academic Presentation Layout (Slide Output) -->
  <g transform="translate(290, 178)">
    <!-- Slide Title Block -->
    <rect x="0" y="4" width="112" height="15" rx="7.5" fill="#f8fafc" />
    <rect x="0" y="27" width="72" height="7" rx="3.5" fill="#818cf8" opacity="0.8" />

    <!-- Visual Presentation Card (Academic Chart / Figure) -->
    <rect x="0" y="46" width="136" height="46" rx="9" fill="#171e36" stroke="url(#c1-accent)" stroke-width="1.6" />
    <!-- 4 Colored Bars for academic data -->
    <rect x="14" y="70" width="9" height="12" rx="2" fill="#38bdf8" />
    <rect x="27" y="62" width="9" height="20" rx="2" fill="#818cf8" />
    <rect x="40" y="54" width="9" height="28" rx="2" fill="#c084fc" />
    <rect x="53" y="59" width="9" height="23" rx="2" fill="#f43f5e" />
    <!-- Card text lines -->
    <rect x="72" y="58" width="52" height="6" rx="3" fill="#f8fafc" />
    <rect x="72" y="70" width="36" height="5" rx="2.5" fill="#94a3b8" />

    <!-- Bullet lines -->
    <rect x="0" y="104" width="94" height="7" rx="3.5" fill="#64748b" opacity="0.8" />
    <rect x="0" y="118" width="124" height="6" rx="3" fill="#475569" opacity="0.5" />
  </g>

  <!-- Slide Progression Timeline at bottom of screen -->
  <rect x="52" y="344" width="150" height="4" fill="#38bdf8" rx="2" />
  <rect x="202" y="344" width="258" height="4" fill="#1e293b" rx="2" />
</svg>
