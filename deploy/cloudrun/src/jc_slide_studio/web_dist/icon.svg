<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Markdown Brand Gradient -->
    <linearGradient id="mdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" opacity="0.7" />

  <!-- Ambient Glow Behind Cards -->
  <circle cx="256" cy="236" r="200" fill="url(#centerGlow)" />

  <!-- Projector Light Beam Downward -->
  <polygon points="206,368 306,368 360,436 152,436" fill="url(#beamGrad)" />

  <!-- Back Stacked Slide (Layer 2) -->
  <g transform="rotate(6 256 220)">
    <rect x="108" y="88" width="312" height="200" rx="18" fill="#171b34" stroke="#4338ca" stroke-width="1.5" opacity="0.6" />
    <line x1="136" y1="120" x2="240" y2="120" stroke="#312e81" stroke-width="6" stroke-linecap="round" />
    <line x1="136" y1="140" x2="320" y2="140" stroke="#312e81" stroke-width="4" stroke-linecap="round" />
    <line x1="136" y1="156" x2="280" y2="156" stroke="#312e81" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Front Slide (Main Workbench / Preview Screen) -->
  <g filter="url(#dropShadow)">
    <rect x="66" y="112" width="380" height="254" rx="22" fill="#0d1322" stroke="url(#cardBorder)" stroke-width="2.5" />

    <!-- Window Top Header -->
    <line x1="66" y1="156" x2="446" y2="156" stroke="#1e293b" stroke-width="1.5" />

    <!-- macOS / App Dots -->
    <circle cx="94" cy="134" r="5" fill="#f43f5e" />
    <circle cx="110" cy="134" r="5" fill="#fbbf24" />
    <circle cx="126" cy="134" r="5" fill="#10b981" />

    <!-- Slide Index Pill -->
    <rect x="206" y="126" width="100" height="16" rx="8" fill="#1e293b" />
    <text x="256" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">SLIDE 01 / 12</text>

    <!-- Live Sync Status -->
    <rect x="374" y="126" width="52" height="16" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <circle cx="384" cy="134" r="3" fill="#38bdf8" />
    <text x="406" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#38bdf8" text-anchor="middle">LIVE</text>

    <!-- LEFT PANEL: Markdown Source Code -->
    <rect x="86" y="174" width="154" height="172" rx="14" fill="#111827" stroke="#1f293d" stroke-width="1.5" />

    <!-- Markdown Card Header -->
    <rect x="98" y="186" width="42" height="7" rx="3.5" fill="#38bdf8" opacity="0.9" />
    <rect x="146" y="186" width="28" height="7" rx="3.5" fill="#475569" opacity="0.5" />

    <!-- Iconic Markdown M and Arrow Symbol -->
    <g transform="translate(8, 4)">
      <!-- M -->
      <path d="M 104 290 V 224 L 128 256 L 152 224 V 290" 
            stroke="url(#mdGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Down Arrow -->
      <path d="M 194 224 V 282" 
            stroke="url(#arrowGrad)" stroke-width="8.5" stroke-linecap="round" />
      <path d="M 178 266 L 194 288 L 210 266" 
            stroke="url(#arrowGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Source lines underneath -->
    <line x1="100" y1="326" x2="160" y2="326" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="168" y1="326" x2="220" y2="326" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

    <!-- CENTRAL CONNECTOR / SYNC BRIDGE -->
    <g filter="url(#softGlow)">
      <circle cx="256" cy="258" r="4" fill="#818cf8" />
      <path d="M 252 250 L 260 258 L 252 266" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- RIGHT PANEL: Rendered Academic Slide -->
    <rect x="272" y="174" width="154" height="172" rx="14" fill="#0b1120" stroke="#1f293d" stroke-width="1.5" />

    <!-- Slide Title and Subtitle -->
    <rect x="286" y="187" width="86" height="9" rx="4.5" fill="#f8fafc" />
    <rect x="286" y="201" width="52" height="6" rx="3" fill="#64748b" />

    <!-- Bullets Column -->
    <circle cx="292" cy="222" r="2.5" fill="#38bdf8" />
    <rect x="299" y="220" width="40" height="5" rx="2.5" fill="#94a3b8" />

    <circle cx="292" cy="236" r="2.5" fill="#38bdf8" />
    <rect x="299" y="234" width="46" height="5" rx="2.5" fill="#94a3b8" />

    <circle cx="292" cy="250" r="2.5" fill="#38bdf8" />
    <rect x="299" y="248" width="34" height="5" rx="2.5" fill="#94a3b8" />

    <!-- Mini Chart / Figure on Right -->
    <rect x="356" y="216" width="56" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Bars -->
    <rect x="364" y="240" width="6" height="14" rx="1.5" fill="#38bdf8" />
    <rect x="373" y="230" width="6" height="24" rx="1.5" fill="#818cf8" />
    <rect x="382" y="224" width="6" height="30" rx="1.5" fill="#c084fc" />
    <rect x="391" y="234" width="6" height="20" rx="1.5" fill="#f43f5e" />

    <!-- Academic Callout / Theorem Box -->
    <rect x="286" y="270" width="126" height="26" rx="6" fill="#172033" stroke="#2563eb" stroke-width="1" />
    <rect x="286" y="270" width="4" height="26" rx="2" fill="#38bdf8" />
    <!-- Math Formula Mock inside callout -->
    <rect x="296" y="278" width="36" height="4" rx="2" fill="#60a5fa" />
    <rect x="296" y="286" width="68" height="3.5" rx="1.5" fill="#94a3b8" />
    <circle cx="398" cy="283" r="3.5" fill="#c084fc" opacity="0.9" />

    <!-- Slide Footer -->
    <line x1="286" y1="314" x2="412" y2="314" stroke="#1e293b" stroke-width="1" />
    <rect x="286" y="322" width="34" height="4" rx="2" fill="#475569" />
    <rect x="392" y="320" width="20" height="8" rx="4" fill="#1e293b" />
    <text x="402" y="326" font-family="monospace" font-size="6.5" fill="#64748b" text-anchor="middle">#1</text>
  </g>

  <!-- Presentation Pedestal Stand and Base -->
  <rect x="196" y="394" width="120" height="14" rx="7" fill="#111827" stroke="url(#cardBorder)" stroke-width="1.5" />
  <rect x="240" y="399" width="32" height="4" rx="2" fill="#38bdf8" />

  <!-- Bottom Brand Subtitle -->
  <text x="256" y="452" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" font-weight="800" letter-spacing="6" fill="#94a3b8" text-anchor="middle">JC · SLIDE STUDIO</text>
</svg>