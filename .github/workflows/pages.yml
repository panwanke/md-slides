name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install .

      - name: Build Presentation Showcase
        run: |
          mkdir -p _site
          python -m md_slide_studio.cli render demo/showcase.md --bundle --out _site
          mv _site/showcase_rendered.html _site/showcase.html
          cp docs/images/icon.svg _site/icon.svg
          cp docs/images/icon-32.png _site/icon-32.png
          cp docs/images/icon-512.png _site/icon-512.png
          cp docs/images/icon-32.png _site/favicon.ico

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Static Studio
        run: |
          cd web
          npm ci
          npm run build:static
          cp -r dist-static/. ../_site/

      - name: Add studio link to showcase
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('_site/showcase.html')
          html = page.read_text(encoding='utf-8')
          badge = (
              '<a href="./" id="md-studio-entry" '
              'style="position:fixed;right:24px;bottom:24px;z-index:9999;'
              'padding:10px 16px;border-radius:999px;background:#1c1f26;color:#eef0f5;'
              'font:14px system-ui;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.25)">'
              '在线工作台 →</a>'
          )
          page.write_text(html.replace('</body>', badge + '\n</body>'), encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
