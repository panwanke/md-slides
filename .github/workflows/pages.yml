name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install .

      - name: Build Presentation Showcase
        run: |
          mkdir -p _site
          python -m jc_slide_studio.cli render demo/showcase.md --bundle --out _site
          mv _site/showcase_rendered.html _site/index.html
          cp docs/images/icon.svg _site/icon.svg
          cp docs/images/icon-32.png _site/icon-32.png
          cp docs/images/icon-512.png _site/icon-512.png
          cp docs/images/icon-32.png _site/favicon.ico

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
