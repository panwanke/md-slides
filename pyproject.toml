[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jc-slide-studio"
version = "0.1.0"
description = "Markdown slide studio and standalone rendering engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Wanke" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "watchfiles>=0.21.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "playwright>=1.42.0",
    "ruff>=0.3.0",
]

[project.scripts]
jc-slide-studio = "jc_slide_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jc_slide_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
